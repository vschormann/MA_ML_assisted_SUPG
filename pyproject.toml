[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supgml"
version = "0.1.0"
description = "Machine-learning-assisted SUPG parameter optimization"
readme = "readme.md"
requires-python = ">=3.9"
authors = [{name = "Vincent Dallmer"}]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
fem = [
    "fenics-ufl",
    "gmsh",
    "mpi4py",
]
ml = [
    "torch>=2",
    "torch-geometric>=2.3",
]
viz = [
    "matplotlib>=3.5",
    "pyvista>=0.40",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100
